[package]
name = "valetrade-companion"
version = "0.1.0"
description = "ValeTrade Desktop Companion — F8 tooltip capture for SpiritVale"
edition = "2021"

[lib]
name = "valetrade_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
capture-core = { path = "../crates/capture-core" }
xcap = "0.9"          # cross-platform monitor capture
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
strip = true
